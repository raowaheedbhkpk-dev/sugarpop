name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found: APK/AAB will be signed for Google Play."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Release is signed with a debug key (fine for testing, NOT for Google Play)."
          fi

      - name: Build debug APK, release APK and release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK (test ads)
        uses: actions/upload-artifact@v4
        with:
          name: sugarpop-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (real ads)
        uses: actions/upload-artifact@v4
        with:
          name: sugarpop-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: sugarpop-release-aab
          path: app/build/outputs/bundle/release/*.aab
